server {
    listen 443 ssl;
    # PQC-SCAN TARGET: Detekce starých cipher suites
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Klasické (zranitelné) sady
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384; 
    
    # Pokud tvůj skener podporuje hybridní, můžeš zkusit přidat fiktivní PQC cipher
    ssl_ciphers KYBER-ECDHE-AES256-GCM-SHA384;
}